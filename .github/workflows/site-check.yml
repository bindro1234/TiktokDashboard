name: Check website

# Verifies the live site against the real published CSV links: each link must
# return CSV with the right header and a CORS header, and the site must render
# without errors. Runs on PRs touching the site, after every deploy, and on demand.
on:
  pull_request:
    paths: ["site/**", "tools/site_check.mjs", ".github/workflows/site-check.yml"]
  workflow_run:
    workflows: ["Deploy website"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      # On a PR, test the PR's own site/ (served locally) against the real CSV;
      # after a deploy or on demand, test the live GitHub Pages site.
      - name: Serve this PR's site locally
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          sleep 1
      - name: Run site check
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8000/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node tools/site_check.mjs "$SITE_URL"

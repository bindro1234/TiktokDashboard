name: Collect TikTok stats

# GitHub cron is UTC and can be late or skip firings. Each window gets several
# firings that cover both summer (UTC+2) and winter time (UTC+1); the collector
# checks Amsterdam time and run_log so each window runs exactly once.
# Backup: the private dashboard Worker (private/wrangler.toml [triggers]) starts this
# workflow with command=auto via workflow_dispatch when a window is open and not done.
on:
  schedule:
    # Every hour: profile windows are every 2 hours on even Amsterdam hours, which are odd
    # or even UTC hours depending on summer/winter time; also covers the Friday refresh.
    # Firings outside an open window only check the time and exit.
    - cron: "10,30,50 * * * *"
    # A finale (started on the private site) runs every 15 minutes; the Cloudflare timer
    # (private/wrangler.toml) drives those runs, and these firings run them too when they land.
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [auto, profiles, refresh, check, today, status, setup]
        default: status
      dry_run:
        description: "Dry run (no scraping, only log expected records)"
        type: boolean
        default: true
      handles:
        description: "check: comma separated handles (empty = accounts with most videos); today: the handles to check (Vandaag tab)"
        type: string
        default: ""

# Never run two collections at the same time; queue instead of cancelling.
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - name: Run collector
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          COMMAND: ${{ github.event_name == 'schedule' && 'auto' || inputs.command }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run && '--dry-run' || '' }}
          HANDLES: ${{ inputs.handles }}
        run: python -m collector "$COMMAND" $DRY_RUN --handles "$HANDLES"

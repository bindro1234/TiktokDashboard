# TikTok campaign tracker configuration.
#
# All times are Europe/Amsterdam local time. GitHub cron runs in UTC and can be
# late or skip runs, so the workflow fires several times per window (plus a backup
# timer on Cloudflare) and the collector decides whether a window still needs its
# run. Summer/winter time is handled here, not in cron.

timezone: Europe/Amsterdam

campaign:
  start_date: 2026-09-28     # first day a new post counts (inclusive)
  end_date: 2026-10-26       # last day a new post counts (inclusive)
  collect_until: 2026-10-26  # scheduled runs stop after this day
  # Free days: posting is optional. A post on a free day still adds to the streak; no post
  # never breaks the streak, is not a missed day and does not count for the "geen post"
  # warning. Collection itself runs as normal on these days.
  off_days:
    weekends: true
    periods:
      - {name: Herfstvakantie, from: 2026-10-19, to: 2026-10-23}

sheets:
  # Private: accounts (student names), run_log, profile_window. Never publish.
  admin_id: 1CnX4WcJkCgKvGXIDRb_P1CTzADUc_qkkCCqQXTpu_No
  # Public: TikTok handles only. Published as CSV for the website.
  data_id: 1syVgGLY2t8XnllGAkWSVvGXmElDJW7ng2pLVQKSXWjA

brightdata:
  profiles_dataset: gd_l1villgoiiidt09ci   # TikTok - Profiles (1 record per profile)
  posts_dataset: gd_lu702nij2f790tmv9h      # TikTok - Posts, discover by profile URL (1 record per post)
  poll_seconds: 15
  timeout_minutes: 30

budget:
  # Hard cap on Bright Data records per calendar month (free records renew on the 1st;
  # above 5,000 it is pay as you go). October at 12 runs a day: ≈13,300-13,800 records with
  # 40 accounts, ≈15,000-15,600 with 45, plus up to ≈1,260 for an 8-hour finale. The weekly
  # refreshes of 16 and 23 Oct reserve the month's remaining profile runs first, so they
  # need ~17,000 here with more than ~42 accounts; 17,500 leaves room for that and a finale.
  monthly_cap: 17500

schedule:
  # A window that failed is retried by the next cron firing, at most this many times.
  max_attempts_per_window: 2
  # A scheduled profiles run is skipped (window done, 0 records) when a real profiles run,
  # e.g. "Nu verversen", happened less than this many minutes ago. Posts after that come
  # in with the next run.
  skip_if_profiles_ran_within_minutes: 60
  # Profile runs every 2 hours, around the clock, on even hours. Each window is one hour
  # long, so a late run can never make the next window skip itself (60-minute rule above).
  # Both crons (collect.yml and private/wrangler.toml) fire every hour, which covers these
  # windows in summer and winter time; tests check that.
  profile_runs:
    - {name: 00u, start: "00:00", end: "00:59"}
    - {name: 02u, start: "02:00", end: "02:59"}
    - {name: 04u, start: "04:00", end: "04:59"}
    - {name: 06u, start: "06:00", end: "06:59"}
    - {name: 08u, start: "08:00", end: "08:59"}
    - {name: 10u, start: "10:00", end: "10:59"}
    - {name: 12u, start: "12:00", end: "12:59"}
    - {name: 14u, start: "14:00", end: "14:59"}
    - {name: 16u, start: "16:00", end: "16:59"}
    - {name: 18u, start: "18:00", end: "18:59"}
    - {name: 20u, start: "20:00", end: "20:59"}
    - {name: 22u, start: "22:00", end: "22:59"}
  posts_refresh:
    name: weekrefresh
    weekday: friday
    start: "08:30"
    end: "10:00"

posts_refresh:
  # Max posts fetched per account in the weekly refresh (also the dry-run upper bound).
  # 40 covers an account that posts twice a day for three weeks, so older campaign days
  # are never cut off. Budget: 45 accounts x 40 = 1,800 reserved per refresh; really used
  # is only the posts that exist (≈1,300 in all of October if everyone posts daily).
  num_of_posts: 40

finale:
  # Finale for the last lesson, started by hand on the private site (Beheer tab), which also
  # sets the deadline. While it runs: profile runs every `every_minutes` (instead of the
  # 2-hourly windows), a countdown and LIVE labels on the presentation; after the deadline the
  # sites show the "Eindstand", frozen at the last run before it. It always ends by itself at
  # the deadline, and never lasts longer than `max_hours`. The budget cap still applies.
  every_minutes: 15
  max_hours: 8
  # From this many days before campaign.end_date the private site reminds you to start it.
  remind_days_before_end: 3

window_check:
  # One-time check (trial week): full campaign pull for the accounts with the most
  # videos, compared against what top_videos + posts_latest had. Runs right after
  # the last profile run of this date (22u). Set date to null to disable.
  date: 2026-10-05
  accounts: 4
  num_of_posts: 40

force_refresh:
  # "Nu verversen" workflow: an extra profiles run on demand. Refused (and logged)
  # when the last real profiles run was less than this many minutes ago.
  min_minutes_between: 30

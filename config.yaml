# TikTok campaign tracker configuration.
#
# All times are Europe/Amsterdam local time. GitHub cron runs in UTC and can be
# late or skip runs, so the workflow fires several times per window (plus a backup
# timer on Cloudflare) and the collector decides whether a window still needs its
# run. Summer/winter time is handled here, not in cron.

timezone: Europe/Amsterdam

campaign:
  start_date: 2026-09-28     # first day a new post counts (inclusive)
  end_date: 2026-10-30       # last day a new post counts (inclusive)
  collect_until: 2026-10-30  # scheduled runs stop after this day
  # Free days: posting is optional. A post on a free day still adds to the streak; no post
  # never breaks the streak, is not a missed day and does not count for the "geen post"
  # warning. Collection itself runs as normal on these days.
  off_days:
    weekends: true
    periods:
      - {name: Herfstvakantie, from: 2026-10-19, to: 2026-10-23}

instagram:
  # The campaign moved from TikTok to Instagram (posts, carousels, reels; no stories). Only Instagram posts
  # from this day (inclusive) to campaign.end_date count; earlier ones are never stored.
  start_date: 2026-10-07

hashtags:
  # School hashtags: one-click presets on the teacher page's Hashtags tab (words without #, lowercase).
  # This is only the start value: teachers change the list on Beheer, which stores it in the private
  # sheet (tab settings) and needs no deploy. Remove the sheet row to fall back to this list.
  school: [glu, grafischlyceumutrecht, av]

sheets:
  # Private: accounts (student names), run_log, profile_window. Never publish.
  admin_id: 1CnX4WcJkCgKvGXIDRb_P1CTzADUc_qkkCCqQXTpu_No
  # Public: TikTok handles only. Published as CSV for the website.
  data_id: 1syVgGLY2t8XnllGAkWSVvGXmElDJW7ng2pLVQKSXWjA

brightdata:
  profiles_dataset: gd_l1villgoiiidt09ci   # TikTok - Profiles (1 record per profile)
  posts_dataset: gd_lu702nij2f790tmv9h      # TikTok - Posts, discover by profile URL (1 record per post)
  # Instagram - Profiles, collect by profile URL: 1 record per account, with its newest 12 posts (pinned
  # posts first): caption, hashtags, id, url, content type. No likes, comments or views in this record.
  instagram_profiles_dataset: gd_l1vikfch901nx3by4
  poll_seconds: 15
  timeout_minutes: 30

budget:
  # Hard cap on Bright Data records per calendar month (free records renew on the 1st;
  # above 5,000 it is pay as you go). October, campaign until 30 Oct, with 48 accounts:
  # ≈17,300 for profile runs (30 days x 12 runs), a refresh reserve of ≈1,920 (48 x 40) and
  # ≈860 for an 8-hour finale (32 Instagram runs of 23 accounts + 2 TikTok runs of 61): ≈20,000. 23,000 leaves room for "Controleer nu" checks
  # (Vandaag tab). Refreshes and checks also reserve the month's remaining profile runs.
  monthly_cap: 23000

schedule:
  # A window that failed is retried by the next cron firing, at most this many times.
  max_attempts_per_window: 2
  # A scheduled profiles run is skipped (window done, 0 records) when a real profiles run,
  # e.g. "Nu verversen", happened less than this many minutes ago. Posts after that come
  # in with the next run.
  skip_if_profiles_ran_within_minutes: 60
  # The pool of profile windows: every 2 hours, around the clock, on even hours. Each window is one
  # hour long, so a late run can never make the next window skip itself (60-minute rule above).
  # Both crons (collect.yml and private/wrangler.toml) fire every hour, which covers every window of
  # the pool in summer and winter time; tests check that. Which of these windows a platform really
  # uses is set under `frequency`.
  profile_runs:
    - {name: 00u, start: "00:00", end: "00:59"}
    - {name: 02u, start: "02:00", end: "02:59"}
    - {name: 04u, start: "04:00", end: "04:59"}
    - {name: 06u, start: "06:00", end: "06:59"}
    - {name: 08u, start: "08:00", end: "08:59"}
    - {name: 10u, start: "10:00", end: "10:59"}
    - {name: 12u, start: "12:00", end: "12:59"}
    - {name: 14u, start: "14:00", end: "14:59"}
    - {name: 16u, start: "16:00", end: "16:59"}
    - {name: 18u, start: "18:00", end: "18:59"}
    - {name: 20u, start: "20:00", end: "20:59"}
    - {name: 22u, start: "22:00", end: "22:59"}
  posts_refresh:
    name: weekrefresh
    weekday: friday
    start: "08:30"
    end: "10:00"

frequency:
  # How often each platform's profiles are pulled, in fixed steps (not a free choice): every step is a
  # set of windows from the pool above, so runs stay aligned with the hourly crons. "off" = no scheduled
  # runs. A TikTok window is keyed 2026-10-12/08u, an Instagram window 2026-10-12/ig-08u: the platforms
  # never mark each other's windows as done, and both count toward the same monthly cap.
  # Start values (they move to the private sheet, on Beheer, in a later step):
  tiktok: 12h        # 08:00 and 20:00: teachers check in the morning, students still post there
  instagram: 4h
  steps:
    daily: [16u]
    12h: [08u, 20u]
    6h: [02u, 08u, 14u, 20u]
    4h: [00u, 04u, 08u, 12u, 16u, 20u]
    2h: [00u, 02u, 04u, 06u, 08u, 10u, 12u, 14u, 16u, 18u, 20u, 22u]

posts_refresh:
  # Max posts fetched per account in the weekly refresh (also the dry-run upper bound).
  # 40 covers an account that posts twice a day for three weeks, so older campaign days
  # are never cut off. Budget: 45 accounts x 40 = 1,800 reserved per refresh; really used
  # is only the posts that exist (≈1,300 in all of October if everyone posts daily).
  num_of_posts: 40

finale:
  # Finale for the last lesson, started by hand on the private site (Beheer tab), which also
  # sets the deadline. While it runs: Instagram profile runs every `every_minutes` (instead of the
  # windows above); TikTok only in the slot the finale starts in and in its last slot (a platform set to "off" on Beheer
  # does not take part), a countdown and LIVE labels on the presentation; after the deadline the
  # sites show the "Eindstand", frozen at the last run before it. It always ends by itself at
  # the deadline, and never lasts longer than `max_hours`. The budget cap still applies.
  every_minutes: 15
  max_hours: 8
  # From this many days before campaign.end_date the private site reminds you to start it.
  remind_days_before_end: 3

window_check:
  # One-time check (trial week): full campaign pull for the accounts with the most
  # videos, compared against what top_videos + posts_latest had. Runs right after
  # the last profile run of this date (22u). Set date to null to disable.
  date: 2026-10-05
  accounts: 4
  num_of_posts: 40

today_check:
  # Vandaag tab on the private site, button "Controleer nu": a profiles run for only the active,
  # non-private accounts that have not posted yet today (1 record per account). Its own run type
  # (today_check), so it never makes a scheduled run skip itself. Respects the monthly cap
  # (keeping the month's remaining profile runs reserved) and waits this long between checks.
  cooldown_minutes: 10

force_refresh:
  # "Nu verversen" workflow: an extra profiles run on demand. Refused (and logged)
  # when the last real profiles run was less than this many minutes ago.
  min_minutes_between: 30
